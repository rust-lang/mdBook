# Configuration for `cargo audit`, see
# https://github.com/rustsec/rustsec/blob/main/cargo-audit/README.md

[advisories]
ignore = [
	# pulldown-cmark@0.13.4 has exponential event growth with `ENABLE_WIKILINKS`
