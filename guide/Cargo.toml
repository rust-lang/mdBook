[package]
name = "mdbook-guide"
version = "0.1.0"
edition = "2018"

[dependencies]
anyhow.workspace = true
clap.workspace = true
mdbook-core.workspace = true
mdbook-renderer.workspace = true
mdbook-preprocessor.workspace = true
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
pulldown-cmark.workspace = true
pulldown-cmark-to-cmark.workspace = true

[workspace]
exclude = ["guide-helper"]

[workspace.dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["cargo", "wrap_help"] }
clap_complete = "4.6.8"
mdbook-core = { path = "../crates/mdbook-core", version = "0.5.4" }
mdbook-driver = { path = "../crates/mdbook-driver", version = "0.5.4" }
mdbook-preprocessor = { path = "../crates/mdbook-preprocessor", version = "0.5.4" }
mdbook-renderer = { path = "../crates/mdbook-renderer", version = "0.5.4" }
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] } # Do not update, part of the public api.
pulldown-cmark-to-cmark = "22.0.0"
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
