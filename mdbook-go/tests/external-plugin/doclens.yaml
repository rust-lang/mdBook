package:
  title: External Plugin Fixture
  language: en
  root: src

build:
  build-dir: book
  create-missing: true

# An external preprocessor that prepends a banner line to every chapter's
# Markdown content. It speaks the JSON-tuple protocol on stdin/stdout and
# honours `supports <renderer>` via the exit code.
preprocessor:
  banner:
    command: node scripts/banner.js
  # A second external preprocessor that exercises `before` / `after`
  # topological ordering and the `renderers` whitelist. It appends a footer
  # to every chapter and only runs for the html backend.
  footer:
    command: node scripts/footer.js
    renderers:
      - html
    after:
      - banner
  # A third preprocessor that returns exit 1 for `supports not-html` so the
  # `renderers` whitelist test (vs. supports probe) is covered.
  noisy:
    command: node scripts/noisy.js

chapters:
  prefix:
    - name: Introduction
      path: intro.md
  numbered:
    - name: Chapter 1
      path: chapter_1.md
    - name: Chapter 2
      path: chapter_2.md
    - name: Conclusion
      path: conclusion.md
